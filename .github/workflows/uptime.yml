name: Uptime Health Check

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 * * * *'  # hourly instead of every 15 min
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Argus API health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://argus-web-backend-production.up.railway.app/health)
          if [ "$STATUS" -ne 200 ]; then
            echo "Health check returned HTTP $STATUS — backend may be scaled down"
          else
            echo "Health check OK (HTTP $STATUS)"
          fi

      - name: Verify stats endpoint
        run: |
          STATS=$(curl -s https://argus-web-backend-production.up.railway.app/stats)
          echo "Stats: $(echo $STATS | head -c 300)"
